<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Conferma eliminazione sondaggio</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 32rem;
            margin: 4rem auto;
            padding: 0 1rem;
            color: #1a1a1a;
        }
        button {
            font-size: 1rem;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
        }
        #status {
            margin-top: 1.5rem;
            white-space: pre-wrap;
        }
        .error { color: #b00020; }
        .success { color: #147a2b; }
    </style>
</head>
<body>
<h1>Conferma eliminazione sondaggio</h1>
<p id="question">Vuoi confermare l'operazione?</p>
<button id="confirmButton" type="button">Conferma</button>
<div id="status"></div>

<script>
    // Pagina statica di conferma per la URL-mode elicitation del tool MCP "request_delete_poll".
    // Non fa parte del canale MCP: agisce essa stessa da client OAuth2 pubblico (Authorization
    // Code + PKCE) verso il PollAuthServer, per ottenere un token con scope "rest" — distinto
    // dallo scope "mcp" usato dal client MCP — con cui chiamare l'endpoint REST di conferma.
    // In questo modo nessun client MCP (anche malevolo) può confermare l'operazione al posto
    // dell'utente: solo un click esplicito in questa pagina, autenticato con l'Auth Server, può farlo.

    // Base URL dell'Authorization Server e client OAuth2 dedicato a questa pagina.
    // Devono coincidere con quanto configurato in PollAuthServer (application.yml:
    // spring.security.oauth2.authorizationserver.issuer e authserver.client.confirm-delete-client).
    const AUTH_SERVER_BASE_URL = "http://localhost:9001";
    const CLIENT_ID = "confirm-delete-web-client";
    const SCOPE = "rest";

    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SESSION_KEY = "confirmDeletePoll";

    const statusEl = document.getElementById("status");
    const confirmButton = document.getElementById("confirmButton");

    function showStatus(message, cssClass) {
        statusEl.textContent = message;
        statusEl.className = cssClass || "";
    }

    function getElicitationIdFromQuery() {
        return new URLSearchParams(window.location.search).get("elicitationId");
    }

    // --- PKCE helpers -------------------------------------------------------

    function base64UrlEncode(bytes) {
        let binary = "";
        bytes.forEach((b) => (binary += String.fromCharCode(b)));
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function randomString(length) {
        const bytes = new Uint8Array(length);
        crypto.getRandomValues(bytes);
        return base64UrlEncode(bytes);
    }

    async function sha256Base64Url(text) {
        const encoded = new TextEncoder().encode(text);
        const digest = await crypto.subtle.digest("SHA-256", encoded);
        return base64UrlEncode(new Uint8Array(digest));
    }

    // --- Passo 1: avvio del flusso Authorization Code + PKCE -----------------

    async function startConfirmationFlow() {
        const elicitationId = getElicitationIdFromQuery();
        if (!elicitationId) {
            showStatus("Parametro 'elicitationId' mancante nell'URL: impossibile procedere.", "error");
            confirmButton.disabled = true;
            return;
        }

        const codeVerifier = randomString(32);
        const codeChallenge = await sha256Base64Url(codeVerifier);
        const state = randomString(16);

        // Conservati per essere recuperati al ritorno dall'Auth Server (stessa origine/tab).
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ elicitationId, codeVerifier, state }));

        const authorizeUrl = new URL(AUTH_SERVER_BASE_URL + "/oauth2/authorize");
        authorizeUrl.searchParams.set("response_type", "code");
        authorizeUrl.searchParams.set("client_id", CLIENT_ID);
        authorizeUrl.searchParams.set("scope", SCOPE);
        authorizeUrl.searchParams.set("redirect_uri", REDIRECT_URI);
        authorizeUrl.searchParams.set("code_challenge", codeChallenge);
        authorizeUrl.searchParams.set("code_challenge_method", "S256");
        authorizeUrl.searchParams.set("state", state);

        window.location.assign(authorizeUrl.toString());
    }

    // --- Passo 2: ritorno dall'Auth Server con il codice di autorizzazione ---

    async function completeConfirmationFlow(code, returnedState) {
        const savedRaw = sessionStorage.getItem(SESSION_KEY);
        if (!savedRaw) {
            showStatus("Sessione di conferma non trovata o scaduta. Richiedi di nuovo l'eliminazione dal client MCP.", "error");
            return;
        }

        const saved = JSON.parse(savedRaw);
        sessionStorage.removeItem(SESSION_KEY);

        if (returnedState !== saved.state) {
            showStatus("Verifica dello stato OAuth2 fallita (possibile tentativo di manomissione). Operazione annullata.", "error");
            return;
        }

        showStatus("Autenticazione completata, recupero del token di conferma in corso...");

        let tokenResponse;
        try {
            tokenResponse = await fetch(AUTH_SERVER_BASE_URL + "/oauth2/token", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                    grant_type: "authorization_code",
                    code: code,
                    redirect_uri: REDIRECT_URI,
                    client_id: CLIENT_ID,
                    code_verifier: saved.codeVerifier
                })
            });
        } catch (err) {
            showStatus("Impossibile contattare l'Authorization Server per ottenere il token: " + err, "error");
            return;
        }

        if (!tokenResponse.ok) {
            showStatus("Impossibile ottenere il token di conferma (HTTP " + tokenResponse.status + "). L'operazione non è stata confermata.", "error");
            return;
        }

        const tokenBody = await tokenResponse.json();
        const accessToken = tokenBody.access_token;

        showStatus("Token ottenuto, invio della conferma di eliminazione in corso...");

        let confirmResponse;
        try {
            confirmResponse = await fetch(
                "/rest/api/v0/delete-poll-requests/" + encodeURIComponent(saved.elicitationId) + "/confirm",
                {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + accessToken }
                }
            );
        } catch (err) {
            showStatus("Impossibile contattare l'endpoint di conferma: " + err, "error");
            return;
        }

        if (confirmResponse.status === 204) {
            showStatus("Operazione confermata: il sondaggio è stato eliminato.", "success");
            return;
        }

        let message = "Richiesta non completata (HTTP " + confirmResponse.status + ").";
        try {
            const errorBody = await confirmResponse.json();
            if (errorBody && errorBody.message) {
                message = errorBody.message;
            }
        } catch (ignored) {
            // corpo non JSON: si usa il messaggio generico sopra
        }
        showStatus(message, "error");
    }

    // --- Bootstrap della pagina ----------------------------------------------

    (function init() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const state = params.get("state");
        const oauthError = params.get("error");

        if (oauthError) {
            showStatus("Autenticazione annullata o non riuscita (" + oauthError + ").", "error");
            confirmButton.disabled = true;
            return;
        }

        if (code && state) {
            // Siamo tornati dall'Auth Server dopo il login/consenso: completiamo il flusso
            // senza richiedere un secondo click, ma solo se l'utente aveva già cliccato "Conferma".
            document.getElementById("question").textContent = "Conferma in corso...";
            confirmButton.disabled = true;
            confirmButton.style.display = "none";
            completeConfirmationFlow(code, state);
            return;
        }

        if (!getElicitationIdFromQuery()) {
            showStatus("Parametro 'elicitationId' mancante nell'URL: impossibile procedere.", "error");
            confirmButton.disabled = true;
            return;
        }

        confirmButton.addEventListener("click", () => {
            confirmButton.disabled = true;
            showStatus("Reindirizzamento all'Authorization Server in corso...");
            startConfirmationFlow();
        });
    })();
</script>
</body>
</html>
