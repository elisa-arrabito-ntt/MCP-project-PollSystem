spring.application.name=pollSystem
spring.profiles.active=local

spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=poll-system-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.streamable.mcp-endpoint=/mcp
spring.ai.mcp.server.request-timeout=2m

# Heartbeat periodico sul canale GET di notifiche asincrone del trasporto Streamable HTTP:
# senza questo, la connessione resta inattiva troppo a lungo e viene chiusa (timeout async
# lato server/Tomcat o lato client), causando i log "Error connecting ... for async
# notifications, will retry" osservati in VS Code.
spring.ai.mcp.server.streamable-http.keep-alive-interval=3m

# URL del PollAuthServer (Authorization Server / Resource Server OAuth2 per MCP)
authorization.server.url=http://localhost:9001

# ?? AGGIUNTA OBBLIGATORIA: Istruisce il Resource Server a fidarsi dei JWT dell'Auth Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9001

spring.ai.mcp.server.capabilities.resources.subscribe=false
spring.ai.mcp.server.capabilities.completion=false

spring.datasource.url=jdbc:postgresql://localhost:5432/pollSystem
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

security.jwt.expiration-minutes=60

# URL-mode elicitation per delete_poll: base URL pubblico usato per costruire il link
# alla pagina statica di conferma e durata di validita' (in minuti) della richiesta pending.
pollsystem.public-base-url=http://localhost:8080
poll.delete-confirmation.ttl-minutes=5

# TEMP: log di debug per diagnosticare il 403 sul canale MCP durante il test manuale.
# Da rimuovere una volta risolto.
logging.level.org.springframework.security=DEBUG
logging.level.org.springaicommunity.mcp=DEBUG

# TEMP: log di debug/trace per osservare i messaggi JSON-RPC scambiati (richieste, risposte,
# notifiche) e capire se una notifica server->client (es. elicitation/complete) trova o meno
# una sessione attiva a cui essere recapitata. Da rimuovere/abbassare a fine diagnosi.
logging.level.io.modelcontextprotocol=TRACE
logging.level.org.springframework.ai.mcp.server.webmvc.transport=DEBUG