spring:
  application:
    name: poll-auth-server
  profiles:
    active: local
  # ⚠️ AGGIUNTA CRUCIALE: Definisce l'identità ufficiale dell'Auth Server
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9001
  datasource:
    url: jdbc:postgresql://localhost:5432/pollSystem
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 9001
  servlet:
    session:
      cookie:
        name: MCP_AUTHORIZATION_SERVER_SESSIONID

# Auth Server Config
authserver:
  client:
    default-client:
      client-id: mcp-client
      client-secret: "{noop}mcp-secret"
    # Client OAuth2 pubblico usato dalla pagina statica di conferma (confirm-delete.html,
    # servita da PollSystem3) per la URL-mode elicitation di delete_poll. Ottiene un token
    # con scope "rest" a vita breve, distinto dallo scope "mcp" usato dal client MCP.
    confirm-delete-client:
      client-id: confirm-delete-web-client
      access-token-ttl-minutes: 2

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
